<head>

<style>
  /* Sizes step by the golden ratio: 16·φⁿ → 26 · 42 · 68 · 110 */

  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center; gap: 26px;
    padding: 0 110px;
    background: radial-gradient(circle at 85% 30%, #10132a, #07080d 60%);
    color: #ecebf5; font-family: system-ui, sans-serif;
  }
  .mark { display: block; align-self: flex-start; height: 68px; width: auto; }        /* φ³, one step below the name */
  h1 { font-size: 110px; line-height: 1; letter-spacing: -.02em; } /* φ⁴ */
  p { font-size: 42px; line-height: 1.3; color: #f4eedc; max-width: 900px; } /* φ² */
  .url { font: 600 26px ui-monospace, Menlo, monospace; letter-spacing: .08em; color: #8b8da3; } /* φ¹ */
</style>
</head>
<body>
  <img class="mark" src="../public/mark.svg" alt="" />
