<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
    padding: 0 96px;
    background: radial-gradient(circle at 85% 30%, #10132a, #07080d 60%);
    color: #ecebf5; font-family: system-ui, sans-serif;
  }
  .mark { display: flex; align-items: center; gap: 18px; }
  .mark i { display: block; }

  .bar { width: 26px; height: 64px; background: #a6f25c; }
  h1 { font-size: 104px; line-height: 1; letter-spacing: -.02em; }
  p { font-size: 44px; line-height: 1.3; color: #f4eedc; max-width: 900px; }
  .url { font: 600 26px ui-monospace, Menlo, monospace; letter-spacing: .08em; color: #8b8da3; }
</style>
</head>
<body>
  <div class="mark"><i class="dot"></i><i class="bar"></i></div>
  <h1>Uri Kutner</h1>
